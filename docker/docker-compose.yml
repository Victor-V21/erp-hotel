services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: hotel_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=hotel_erp;Username=postgres;Password=postgrespassword;Include Error Detail=true"
      Jwt__SecretKey: "SuperSecretKey2024HotelERPHonduras!@#$%^&*()MinimumLength32Chars"
      Jwt__Issuer: "HotelERP"
      Jwt__Audience: "HotelERP"
      Backup__Enabled: "true"
      Backup__LocalPath: "/hotel-erp/backups"
      Backup__RunAt: "02:00"
      Backup__PendingUploadIntervalHours: "2"
      Backup__RetentionYears: "5"
      Backup__GoogleDriveUploadCommand: "rclone copy {file} gdrive:HotelERPBackups"
    volumes:
      - ../data/backups:/hotel-erp/backups
      - ../data/secrets/rclone:/root/.config/rclone
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api

volumes:
  postgres_data:
